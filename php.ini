[PHP]
; Configuración de límites de upload para Digifolio
; Soporta archivos hasta 300MB

; Límite de tamaño de archivo en uploads (bytes: 350M = 367001600)
upload_max_filesize = 350M

; Tamaño máximo de datos POST (debe ser >= upload_max_filesize)
post_max_size = 350M

; Tiempo máximo de ejecución de scripts (segundos)
max_execution_time = 300

; Tiempo máximo para leer entrada (segundos)
max_input_time = 300

; Límite de memoria para scripts
memory_limit = 512M
